{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

{% if edit %}
<form method="post" action="{{ url_for('assignments.edit_assignment', delivery_id=delivery_id, order_id=order_id) }}">
{% else %}
<form method="post" action="{{ url_for('assignments.create_assignment', delivery_id=delivery_id, order_id=order_id) }}">
{% endif %}

  <p><a href="#" onclick="history.back(); return false;">← Back</a></p>

  <table class="assignment-table">
      <thead>
        <tr>
          <th>Delivery</th>
          <th>Assigned Qty</th>
          <th>Order</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <select name="deliveries" disabled>
              {% for d in deliveries %}
                {% if delivery_id == d.id %}
                <option value="{{ d.id }}" selected>{{ d.delivery_quantity }}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{{ d.delivery_date.strftime('%d.%m.%Y') }}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{{ d.delivery_date.strftime('CW%V/%g') }}</option>
                {% else %}
                <option value="{{ d.id }}">{{ d.delivery_quantity }}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{{ d.delivery_date.strftime('%d.%m.%Y') }}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{{ d.delivery_date.strftime('CW%V/%g') }}</option>
                {% endif %}
              {% endfor %}
            </select>
          </td>
          <td>
            <input value="{{ qty }}" class="normal" name="qty" type="number" step="1" min="1" max="{{ max_qty }}"></input>&nbsp;Max. {{ max_qty }}pcs
          </td>
          <td>
            <select name="orders" disabled>
              {% for o in orders %}
                {% if order_id == o.id %}
                <option value="{{ o.id }}" selected>{{ o.order_number }}</option>
                {% else %}
                <option value="{{ o.id }}">{{ o.order_number }}</option>
                {% endif %}
              {% endfor %}
            </select>
          </td>
      </tr>
      </tbody>
  </table>
  <br>
  <button type="submit">{{ action }}</button>

</form>

{% if edit %}
<form method="post" action="{{ url_for('assignments.delete_assignment', delivery_id=delivery_id, order_id=order_id) }}" style="display:inline" onsubmit="return confirm('Delete this assignment?');">
  <button type="submit">Delete</button>
</form>
{% endif %}

{% endblock %}
